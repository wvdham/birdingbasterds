<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0E0D0C">
<link rel="stylesheet" href="{{root}}assets/style.css?v={{cssv}}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#129413;</text></svg>">
</head>
<body data-page="{{slug}}">
<!--
THESIS: een zelfontdekcompetitie is een ranglijst, dus de stand is de pagina en niet
een alinea met namen erin. Geen blogthema, geen kaartjesraster.
OWN-WORLD: bijna zwart, amber als enige accent, monospace voor alle cijfers en labels,
schreefloos voor namen en lopende tekst. Rijen met een dunne lijn ertussen, de leider
met een amberen rand. Vlak, geen schaduw, geen glans.
STORY: de bezoeker ziet in een oogopslag wie er bovenaan staat en waarmee, en kan van
daaruit terug in de tijd of door naar de spelregels.
FIRST VIEWPORT: naam van de club groot en gesperd, motto eronder in amber, tabbalk,
dan direct de stand: rangnummer, naam, puntentotaal groot rechts, vondsten eronder.
FORM: scorebord, door Wouter gekozen uit drie richtingen.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->
<header class="site">
  <div class="site__inner">
    <a class="brand" href="{{root}}">
      <{{brand_open}} class="brand__name">Birding Basterds</{{brand_close}}>
      <span class="brand__motto">Find rare or die trying</span>
    </a>
    <nav class="nav">{{nav}}</nav>
  </div>
</header>
<main class="wrap">
  {{pagekop}}
  {{body}}
</main>
<footer class="site-footer">
  <p>Deelname aan de competitie kan alleen op uitnodiging</p>
</footer>
</body>
</html>
